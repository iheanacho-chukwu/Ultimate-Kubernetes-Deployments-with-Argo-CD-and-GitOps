# Child Application — DEV — web-beta workload.

apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: gitops-example-web-beta-dev
  namespace: argocd
  labels:
    gitops-example.io/environment: dev
    gitops-example.io/app: web-beta
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/iheanacho-chukwu/Ultimate-Kubernetes-Deployments-with-Argo-CD-and-GitOps.git
    targetRevision: helm
    path: gitops-example/environments/dev/web-beta
    kustomize:
      buildOptions: --enable-helm --load-restrictor LoadRestrictionsNone
  destination:
    server: https://kubernetes.default.svc
    namespace: gitops-example-web-beta
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
    automated:
      prune: true
      selfHeal: true
