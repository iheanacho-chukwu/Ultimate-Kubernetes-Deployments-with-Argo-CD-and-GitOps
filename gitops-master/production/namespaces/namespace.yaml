# Namespace used to deploy client applications e.g merchant-api
apiVersion: v1
kind: Namespace
metadata:
  name: apps
  annotations:
    linkerd.io/inject: enabled
    config.linkerd.io/skip-outbound-ports: "4222,3306,6379,5432" # nats, mysql and redis

---
# Namespace used to deploy internal tools e.g Ingress
apiVersion: v1
kind: Namespace
metadata:
  name: internal-system