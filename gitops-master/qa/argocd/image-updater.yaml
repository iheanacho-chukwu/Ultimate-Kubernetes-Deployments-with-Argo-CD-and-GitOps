apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: argocd-image-updater
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://argoproj.github.io/argo-helm
    chart: argocd-image-updater
    targetRevision: 0.6.0
    helm:
      values: |
        config:
          argocd:
            grpcWeb: false
            serverAddress: "http://argocd-server.argocd"
            insecure: true
            plaintext: true
          registries:
            - name: Google Container Registry
              api_url: https://eu.gcr.io
              prefix: eu.gcr.io
              ping: no
              credentials: pullsecret:argocd/optty-qa-gcr
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true

