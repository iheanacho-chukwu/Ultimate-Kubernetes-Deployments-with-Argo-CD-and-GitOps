    #loki:
    #  configs:
    #  - name: integrations
    #    clients:
    #    - url: https://logs-prod-eu-west-0.grafana.net/api/prom/push
    #      basic_auth:
    #        username: ${LOKI_USERNAME}
    #        password: ${LOKI_PASSWORD}
    #      external_labels:
    #        cluster: cloud
    #    positions:
    #      filename: /tmp/positions.yaml
    #    target_config:
    #      sync_period: 10s
    #    scrape_configs:
    #    - job_name: integrations/nginx
    #      static_configs:
    #      - targets:
    #        - localhost
    #        labels:
    #          host: <http_hostname>
    #          __path__: <path to json nginx access log>

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana-agent
  namespace: observability
spec:
  minReadySeconds: 10
  replicas: 1
  revisionHistoryLimit: 10
  selector:
    matchLabels:
      name: grafana-agent
  template:
    metadata:
      labels:
        name: grafana-agent
    spec:
      containers:
      - args:
        - -config.file=/etc/agent/agent.yaml
        - -config.expand-env
        command:
        - /bin/agent
        env:
        - name: HOSTNAME
          valueFrom:
            fieldRef:
              fieldPath: spec.nodeName
        - name: CLUSTER_NAME
          value: optty-gke-dev
        - name: PROM_USERNAME
          valueFrom:
            secretKeyRef:
              key: grafana-cloud-prom-username
              name: observability-secret
        - name: PROM_PASSWORD
          valueFrom:
            secretKeyRef:
              key: grafana-cloud-prom-password
              name: observability-secret
        - name: LOKI_USERNAME
          valueFrom:
            secretKeyRef:
              key: grafana-cloud-loki-username
              name: observability-secret
        - name: LOKI_PASSWORD
          valueFrom:
            secretKeyRef:
              key: grafana-cloud-loki-password
              name: observability-secret                          
        image: grafana/agent:v0.21.2
        imagePullPolicy: IfNotPresent
        name: agent
        ports:
        - containerPort: 12345
          name: http-metrics
        volumeMounts:
        - mountPath: /etc/agent
          name: grafana-agent
      serviceAccount: grafana-agent
      volumes:
      - configMap:
          name: grafana-agent
        name: grafana-agent
