# App of Apps — parent application (layer 1).
#
# This Application does NOT deploy the nginx workload. It only syncs a folder
# of Argo CD `Application` YAMLs in `argocd/apps/`. Argo then reconciles each
# child Application (e.g. hello-world-dev) which in turn syncs the real charts.
#
# One-time bootstrap (after Argo CD is installed):
#   kubectl apply -n argocd -f hello-world-argocd-aks/argocd/app-of-apps.yaml
#
# Flow in one sentence:
#   Git (apps/*.yaml) → this parent Application → child Application(s) → workloads.

apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: hello-world-app-of-apps
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/iheanacho-chukwu/Ultimate-Kubernetes-Deployments-with-Argo-CD-and-GitOps.git
    targetRevision: main
    path: hello-world-argocd-aks/argocd/apps
    directory:
      include: "*.yaml"
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
    automated:
      prune: true
      selfHeal: true
