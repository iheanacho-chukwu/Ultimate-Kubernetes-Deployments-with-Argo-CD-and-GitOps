# Child application (layer 2 of App of Apps).
# Syncs the hello-world workload for the dev environment.
# Do not `kubectl apply` this file alone in production GitOps; use the root app
# in `app-of-apps.yaml` so the parent Application manages this from Git.
#
# (Applying this file by itself is still valid for a minimal hand-on exercise.)

apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: hello-world-dev
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/iheanacho-chukwu/Ultimate-Kubernetes-Deployments-with-Argo-CD-and-GitOps.git
    targetRevision: main
    path: hello-world-argocd-aks/environments/dev
    kustomize:
      buildOptions: --enable-helm --load-restrictor LoadRestrictionsNone
  destination:
    server: https://kubernetes.default.svc
    namespace: hello-world-dev
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
    automated:
      prune: true
      selfHeal: true
