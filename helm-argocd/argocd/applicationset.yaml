# ApplicationSet — generates one ArgoCD Application per environment automatically.
#
# Instead of maintaining three separate Application YAMLs, a single ApplicationSet
# iterates over the `elements` list and stamps out an Application for each entry,
# substituting {{env}} and {{namespace}} in the template.
#
# Apply:  kubectl apply -n argocd -f argocd/applicationset.yaml
#
# This creates three Applications in the ArgoCD UI:
#   hello-world-dev       → kustomize/overlays/dev     → hello-world-dev namespace
#   hello-world-staging   → kustomize/overlays/staging → hello-world-staging namespace
#   hello-world-prod      → kustomize/overlays/prod    → hello-world-prod namespace

apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: hello-world
  namespace: argocd
spec:
  # -------------------------------------------------------------------
  # Generator: list — defines the variable values for each environment
  # -------------------------------------------------------------------
  generators:
    - list:
        elements:
          - env: dev
            namespace: hello-world-dev
          - env: staging
            namespace: hello-world-staging
          - env: prod
            namespace: hello-world-prod

  # -------------------------------------------------------------------
  # Template: the Application that gets generated per element
  # {{env}} and {{namespace}} are replaced with the element values above
  # -------------------------------------------------------------------
  template:
    metadata:
      name: "hello-world-{{env}}"          # e.g. hello-world-dev
      namespace: argocd
      finalizers:
        - resources-finalizer.argocd.argoproj.io
      labels:
        environment: "{{env}}"
        managed-by: applicationset
    spec:
      project: default

      source:
        repoURL: https://github.com/YOUR_ORG/Ultimate-Kubernetes-Deployments-with-Argo-CD-and-GitOps.git
        targetRevision: main
        path: "hello-world-argocd-aks/kustomize/overlays/{{env}}"

      destination:
        server: https://kubernetes.default.svc
        namespace: "{{namespace}}"          # e.g. hello-world-dev

      syncPolicy:
        syncOptions:
          - CreateNamespace=true
        automated:
          prune: true
          selfHeal: true
