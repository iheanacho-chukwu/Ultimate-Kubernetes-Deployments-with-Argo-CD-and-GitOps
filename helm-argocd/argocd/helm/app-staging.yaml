# Apply:  kubectl apply -n argocd -f argocd/helm/app-staging.yaml

apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: hello-world-helm-staging
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  labels:
    environment: staging
    approach: helm
spec:
  project: default

  source:
    repoURL: https://github.com/YOUR_ORG/Ultimate-Kubernetes-Deployments-with-Argo-CD-and-GitOps.git
    targetRevision: main
    path: hello-world-argocd-aks/helm/hello-world

    helm:
      valueFiles:
        - values.yaml
        - values-staging.yaml       # replicas=2, message="... STAGING"

  destination:
    server: https://kubernetes.default.svc
    namespace: hello-world-helm-staging

  syncPolicy:
    syncOptions:
      - CreateNamespace=true
    automated:
      prune: true
      selfHeal: true
