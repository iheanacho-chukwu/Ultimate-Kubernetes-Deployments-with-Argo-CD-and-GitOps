apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "hello-world.fullname" . }}-html
  labels:
    {{- include "hello-world.labels" . | nindent 4 }}
data:
  index.html: |
    <!DOCTYPE html>
    <html lang="en">
    <head>
      <meta charset="utf-8">
      <title>Hello World — {{ .Values.environment | upper }}</title>
      <style>
        body { font-family: sans-serif; display:flex; flex-direction:column;
               align-items:center; justify-content:center; height:100vh; margin:0;
               {{- if eq .Values.environment "dev" }}background:#d4edda;{{- end }}
               {{- if eq .Values.environment "staging" }}background:#fff3cd;{{- end }}
               {{- if eq .Values.environment "prod" }}background:#cce5ff;{{- end }} }
        .badge { padding:4px 12px; border-radius:4px; font-size:.85rem; font-weight:600;
                 {{- if eq .Values.environment "dev" }}background:#155724;color:#fff;{{- end }}
                 {{- if eq .Values.environment "staging" }}background:#856404;color:#fff;{{- end }}
                 {{- if eq .Values.environment "prod" }}background:#004085;color:#fff;{{- end }} }
      </style>
    </head>
    <body>
      <h1>{{ .Values.message }}</h1>
      <span class="badge">{{ .Values.environment | upper }}</span>
      <p style="margin-top:1rem;color:#555">AKS + Argo CD + Helm</p>
    </body>
    </html>
