apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# All resources land in this namespace
namespace: hello-world-dev

# Pull in base manifests + add the Namespace resource for this env
resources:
  - ../../base
  - namespace.yaml

# Strategic-merge patches: kustomize merges these on top of the base resources
patches:
  - path: deployment-patch.yaml
  - path: configmap-patch.yaml
